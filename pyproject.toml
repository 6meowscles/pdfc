[project]
name = "pdfc"
version = "0.1.0"
description = "Local PDF converter CLI"
requires-python = ">=3.11"
dependencies = [
    "click",
    "rich",
    "pymupdf",
    "pillow",
    "markdown",
    "weasyprint",
    "ocrmypdf",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pdfc = "pdfc.cli:_entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_libreoffice: requires the libreoffice binary",
    "needs_tesseract: requires the tesseract binary",
    "needs_gs: requires the ghostscript binary",
]
