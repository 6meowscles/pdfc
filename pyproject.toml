[project]
name = "pdfc"
dynamic = ["version"]
description = "Local PDF converter CLI"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "click",
    "rich",
    "pymupdf",
    "pillow",
    "markdown",
    "weasyprint",
    "ocrmypdf",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pdfc = "pdfc.cli:_entry"

# Single-source the version from the package, so a release tag and the
# metadata cannot drift apart.
[tool.setuptools.dynamic]
version = {attr = "pdfc.__version__"}

# Say which packages ship rather than letting setuptools guess: the
# repository has a second top-level directory (packaging/) that is not a
# Python package, and flat-layout auto-discovery refuses to choose.
[tool.setuptools.packages.find]
include = ["pdfc*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "needs_libreoffice: requires the libreoffice binary",
    "needs_tesseract: requires the tesseract binary",
    "needs_gs: requires the ghostscript binary",
    "needs_ocrmypdf: requires the ocrmypdf package",
]
